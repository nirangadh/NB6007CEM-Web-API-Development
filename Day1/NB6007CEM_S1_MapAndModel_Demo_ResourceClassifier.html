<!--
  NB6007CEM S1 — Resource Type Classifier Demo
  When to open: after slides 21–22 (Five Resource Kinds + Clients Win Over Data)
  What to ask students: "Drop an entity from the domain model and see which of the
  five REST API Design resource kinds it resolves to — and the rule that decided it."
  Teaching point: the five kinds are not decoration; they determine HTTP methods,
  URI templates, and naming rules for the entire API design process.
  Safe by construction: no network calls, no external APIs, fully offline.
  Palette: teal #1A9988, orange #EB5600, steel-blue #6AA4C8, mint #A2FFE8, near-black #1A1A1A
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Type Classifier — NB6007CEM S1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', 'Segoe UI', sans-serif;
      background: #F4F7F9;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1A9988;
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .badge {
      background: #EB5600;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 2px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header p  { font-size: 13px; opacity: 0.85; margin-top: 2px; }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      flex: 1;
    }

    /* ── LEFT PANEL ── */
    .left {
      background: #fff;
      border-right: 1px solid #DDE3E7;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .left h2 { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #1A9988; text-transform: uppercase; }

    /* Entity cards */
    .entity-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .entity-card {
      background: #F4F7F9;
      border: 2px solid #DDE3E7;
      border-radius: 4px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      user-select: none;
    }
    .entity-card:hover {
      border-color: #1A9988;
      background: #E8F6F4;
      transform: translateX(3px);
    }
    .entity-card.active {
      border-color: #1A9988;
      background: #D0EDE9;
    }
    .entity-card .name { font-size: 15px; font-weight: 700; }
    .entity-card .attrs { font-size: 11px; color: #595959; margin-top: 3px; font-style: italic; }

    /* Custom concept input */
    .custom-section { border-top: 1px solid #DDE3E7; padding-top: 16px; }
    .custom-section label { font-size: 12px; font-weight: 700; color: #595959; display: block; margin-bottom: 6px; }
    .custom-row { display: flex; gap: 8px; }
    .custom-row input {
      flex: 1; padding: 8px 10px; border: 2px solid #DDE3E7; border-radius: 4px;
      font-size: 14px; font-family: inherit;
    }
    .custom-row input:focus { outline: none; border-color: #1A9988; }
    .custom-row button {
      background: #1A9988; color: #fff; border: none; border-radius: 4px;
      padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .custom-row button:hover { background: #157a6e; }

    /* ── RIGHT PANEL ── */
    .right {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Result card */
    .result-card {
      background: #fff;
      border-radius: 6px;
      border: 2px solid #DDE3E7;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .result-card.visible { border-color: #1A9988; }

    .result-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #E9EDEE;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .result-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      padding: 4px 10px; border-radius: 2px; color: #fff;
      text-transform: uppercase;
      background: #BDBDAC;
    }
    .result-kind { font-size: 26px; font-weight: 700; color: #1A1A1A; }
    .result-subject { font-size: 14px; color: #595959; margin-top: 2px; }

    .result-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    .result-body .rule-block {
      background: #F4F7F9;
      border-left: 4px solid #1A9988;
      padding: 12px 16px;
      border-radius: 0 4px 4px 0;
    }
    .result-body .rule-block .rule-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #1A9988;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .result-body .rule-block .rule-text { font-size: 14px; line-height: 1.55; }

    .result-body .consequence {
      background: #FFF3EE;
      border-left: 4px solid #EB5600;
      padding: 12px 16px;
      border-radius: 0 4px 4px 0;
    }
    .consequence .con-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #EB5600;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .consequence .con-text { font-size: 13px; line-height: 1.55; }

    /* Example URI chip */
    .uri-example {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: #1A1A1A;
      color: #A2FFE8;
      padding: 10px 16px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    /* 5-kind legend */
    .legend {
      background: #fff;
      border-radius: 6px;
      border: 1px solid #DDE3E7;
      padding: 16px 20px;
    }
    .legend h3 {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      color: #1A9988; text-transform: uppercase; margin-bottom: 12px;
    }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .legend-item {
      padding: 8px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .legend-item:hover { opacity: 0.85; }
    .legend-item.dim { opacity: 0.3; }

    /* Placeholder */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      color: #BDBDAC;
      gap: 10px;
      text-align: center;
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.4; }
    .placeholder p { font-size: 14px; }

    /* Decision questions */
    .questions { display: flex; flex-direction: column; gap: 10px; }
    .q-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px;
      background: #F4F7F9;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
    }
    .q-yes  { background: #E8F6F4; }
    .q-no   { background: #FFF3EE; }
    .q-dot  { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }

    footer {
      background: #1A1A1A;
      color: #BDBDAC;
      font-size: 11px;
      padding: 10px 28px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="badge">S1 DEMO</div>
    <h1>Resource Type Classifier</h1>
    <p>REST API Design §4 — Tuk-Tuk Monitoring System</p>
  </div>
</header>

<main>
  <!-- LEFT: entity selector -->
  <div class="left">
    <div>
      <h2>Domain Entities</h2>
      <p style="font-size:12px;color:#595959;margin-top:4px">Click an entity to classify it.</p>
    </div>
    <div class="entity-grid" id="entityGrid"></div>

    <div class="custom-section">
      <label>Try a concept of your own</label>
      <div class="custom-row">
        <input type="text" id="customInput" placeholder="e.g. last known position" />
        <button onclick="classifyCustom()">Classify</button>
      </div>
    </div>

    <div class="legend">
      <h3>The 5 Kinds</h3>
      <div class="legend-grid" id="legend"></div>
    </div>
  </div>

  <!-- RIGHT: result -->
  <div class="right">
    <div class="result-card" id="resultCard">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <p>Select an entity from the left<br>to see its resource classification.</p>
      </div>
      <div id="resultContent" style="display:none"></div>
    </div>
  </div>
</main>

<footer>NB6007CEM Web API Development — NIBM / Coventry University — For classroom use only</footer>

<script>
// ── DATA ───────────────────────────────────────────────────────────────────

const KINDS = [
  { id:'atomic',     label:'Atomic',     color:'#1A9988', short:'Single instance' },
  { id:'collection', label:'Collection', color:'#6AA4C8', short:'Set of atomics'   },
  { id:'composite',  label:'Composite',  color:'#1C3678', short:'Bundle as one'    },
  { id:'processing', label:'Processing\nFunction', color:'#EB5600', short:'Derived computation' },
  { id:'controller', label:'Controller', color:'#BDBDAC', short:'Multi-resource op' },
];

const ENTITIES = [
  {
    name: 'Province',
    attrs: 'province_id, name',
    kind: 'atomic',
    rule: 'Province instances are exchanged whole and exist independently. Police queries do not need to traverse Province relationships to retrieve a Province — it stands alone.',
    consequence: 'Becomes a URI like /provinces/{province-id}. GET retrieves one instance. No factory pattern needed unless the system supports creating new provinces.',
    uri: 'GET /provinces/{province-id}',
    questions: [
      { text: 'Is it exchanged as a whole, standalone instance?', answer: 'yes' },
      { text: 'Does accessing it require traversing relationships?', answer: 'no' },
      { text: 'Is it grouped into a set for the API?', answer: 'yes (but as the member, not the collection)' },
    ]
  },
  {
    name: 'District',
    attrs: 'district_id, name, province_id',
    kind: 'atomic',
    rule: 'District is an independently addressable instance. A police user may retrieve a specific district by its ID without needing to go through its parent Province.',
    consequence: 'Becomes /districts/{district-id}. The province_id attribute references Province without making District a child-only resource.',
    uri: 'GET /districts/{district-id}',
    questions: [
      { text: 'Is it exchanged as a whole, standalone instance?', answer: 'yes' },
      { text: 'Must it be accessed only through its parent?', answer: 'no — it has its own identity' },
    ]
  },
  {
    name: 'PoliceStation',
    attrs: 'station_id, name, district_id',
    kind: 'atomic',
    rule: 'Police stations are independently identifiable entities. A station officer authenticates with a specific station ID — stations are first-class citizens of the system.',
    consequence: 'Becomes /stations/{station-id}. Jurisdiction scoping later links stations to the read-scope of police users.',
    uri: 'GET /stations/{station-id}',
    questions: [
      { text: 'Is it exchanged as a whole, standalone instance?', answer: 'yes' },
      { text: 'Does the system query stations directly?', answer: 'yes — for jurisdiction scoping' },
    ]
  },
  {
    name: 'Vehicle',
    attrs: 'vehicle_id, reg_number, device_id, station_id',
    kind: 'atomic',
    rule: 'Each vehicle is an independently addressable entity. IoT devices authenticate as their vehicle — the vehicle ID is the identity anchor for all location data.',
    consequence: 'Becomes /vehicles/{vehicle-id}. The device_id attribute is embedded here (not a separate Device resource). Vehicles are also members of a Vehicles collection.',
    uri: 'GET /vehicles/{vehicle-id}',
    questions: [
      { text: 'Is it exchanged as a whole, standalone instance?', answer: 'yes' },
      { text: 'Does it serve as the identity anchor for sub-resources?', answer: 'yes — pings live under it' },
    ]
  },
  {
    name: 'LocationPing',
    attrs: 'ping_id, vehicle_id, timestamp, lat, lng, speed',
    kind: 'collection',
    rule: 'Pings are always accessed as a group scoped to a vehicle — not individually retrieved and not meaningful as a free-standing global collection. This is a scoped collection (REST API Design §5.6): the collection of all pings ever across all vehicles is never of interest.',
    consequence: 'Becomes /vehicles/{vehicle-id}/pings — a scoped collection under a vehicle. HTTP GET on this collection returns filtered, paginated history. Individual pings are rarely retrieved by ID alone.',
    uri: 'GET /vehicles/{vehicle-id}/pings',
    questions: [
      { text: 'Is it always accessed as a group?', answer: 'yes' },
      { text: 'Does the group only make sense under a parent?', answer: 'yes — under a specific vehicle' },
      { text: 'Is the global set (all pings ever) useful?', answer: 'no — scoped collection' },
    ]
  },
  {
    name: 'Vehicles (collection)',
    attrs: 'A set of Vehicle instances',
    kind: 'collection',
    rule: 'Whenever the API supports creating new Vehicle instances, Vehicle becomes a collection resource. A collection resource is a factory for its members (REST API Design §7.3).',
    consequence: 'Becomes /vehicles. POST to this URI creates a new vehicle and returns 201 + Location. GET returns a filtered list. The collection is scoped by jurisdiction for police users.',
    uri: 'POST /vehicles  →  201 + Location: /vehicles/{new-id}',
    questions: [
      { text: 'Are instances of this type grouped into a set?', answer: 'yes' },
      { text: 'Does the API support creating new instances?', answer: 'yes — so it needs a collection resource as factory' },
    ]
  },
  {
    name: 'Last Known Position',
    attrs: '(derived from LocationPing)',
    kind: 'processing',
    rule: 'Last known position is not stored as an entity — it is computed from the most recent LocationPing for a vehicle. It provides access to a function that processes existing resources.',
    consequence: 'Becomes /vehicles/{vehicle-id}/last-position (a processing function resource named as a noun-verb phrase, not a collection). Uses GET. Returns the derived result, not a set of records.',
    uri: 'GET /vehicles/{vehicle-id}/last-position',
    questions: [
      { text: 'Is it directly stored in the data model?', answer: 'no — it is derived' },
      { text: 'Does it process or aggregate existing resources?', answer: 'yes — computes from LocationPing' },
      { text: 'Is it a predefined partial update or computation?', answer: 'yes — predefined computation' },
    ]
  },
  {
    name: 'User',
    attrs: 'user_id, role (HQ / Prov / Dist / Sta)',
    kind: 'atomic',
    rule: 'Police users are independently addressable entities used for authentication and role-based scoping. User is an atomic resource even though it shapes all read operations in the system.',
    consequence: 'Becomes /users/{user-id} for management. Users are not data producers — they authenticate and query. User role determines read scope. Never appears in the write path.',
    uri: 'GET /users/{user-id}',
    questions: [
      { text: 'Is it an independently identifiable entity?', answer: 'yes' },
      { text: 'Is it the data producer?', answer: 'NO — this is the most common generator mistake' },
    ]
  },
];

const CUSTOM_RULES = {
  keywords: {
    'location history': { kind:'collection', uri:'GET /vehicles/{id}/pings?from=...&to=...', note:'Filtered view of the pings scoped collection — same resource, different query parameters.' },
    'transfer': { kind:'controller', uri:'POST /apply-transfer', note:'Moving a vehicle between stations requires consistent updates across Station and Vehicle — a controller resource maintains integrity.' },
    'search': { kind:'processing', uri:'POST /vehicle-search', note:'Complex queries that exceed URI length limits become processing function resources using POST.' },
    'report': { kind:'processing', uri:'GET /reports/{type}', note:'Derived summary output — a processing function resource.' },
  }
};

// ── RENDER ──────────────────────────────────────────────────────────────────

function renderLegend() {
  const grid = document.getElementById('legend');
  KINDS.forEach(k => {
    const el = document.createElement('div');
    el.className = 'legend-item';
    el.id = 'leg-' + k.id;
    el.style.background = k.color;
    el.textContent = k.label.replace('\n', ' ');
    el.title = k.short;
    grid.appendChild(el);
  });
}

function renderEntities() {
  const grid = document.getElementById('entityGrid');
  ENTITIES.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'entity-card';
    card.id = 'ent-' + i;
    card.innerHTML = `<div class="name">${e.name}</div><div class="attrs">${e.attrs}</div>`;
    card.onclick = () => classify(i);
    grid.appendChild(card);
  });
}

function highlightLegend(kindId) {
  KINDS.forEach(k => {
    const el = document.getElementById('leg-' + k.id);
    if (el) el.classList.toggle('dim', k.id !== kindId);
  });
}

function clearActiveCards() {
  document.querySelectorAll('.entity-card').forEach(c => c.classList.remove('active'));
}

function classify(idx) {
  const e = ENTITIES[idx];
  clearActiveCards();
  document.getElementById('ent-' + idx).classList.add('active');
  showResult(e.name, e.kind, e.rule, e.consequence, e.uri, e.questions);
}

function classifyCustom() {
  const raw = document.getElementById('customInput').value.trim().toLowerCase();
  if (!raw) return;
  let match = null;
  for (const [kw, rule] of Object.entries(CUSTOM_RULES.keywords)) {
    if (raw.includes(kw)) { match = { ...rule, name: document.getElementById('customInput').value.trim() }; break; }
  }
  clearActiveCards();
  if (match) {
    showResult(match.name, match.kind, match.note, '', match.uri, []);
  } else {
    showResult(
      document.getElementById('customInput').value.trim(),
      null,
      'This concept does not map directly to a single entity in the tuk-tuk domain model. Consider: is it a derived computation (processing function)? Does it aggregate existing resources (collection)? Does it need to keep multiple resources consistent (controller)?',
      '',
      '',
      [
        { text: 'Is it stored directly in the ER model?', answer: 'if yes → atomic or collection' },
        { text: 'Is it derived or computed from existing data?', answer: 'if yes → processing function' },
        { text: 'Does it need to update multiple resources atomically?', answer: 'if yes → controller' },
      ]
    );
  }
}

function showResult(name, kindId, rule, consequence, uri, questions) {
  const kind = KINDS.find(k => k.id === kindId);
  document.getElementById('placeholder').style.display = 'none';
  const rc = document.getElementById('resultCard');
  rc.classList.add('visible');

  const qHtml = questions.length ? `
    <div class="questions">
      ${questions.map(q => `
        <div class="q-item ${q.answer.startsWith('yes') ? 'q-yes' : q.answer === 'no' ? 'q-no' : ''}">
          <span class="q-dot" style="background:${q.answer.startsWith('yes') ? '#1A9988' : q.answer === 'no' ? '#EB5600' : '#BDBDAC'}"></span>
          <span><strong>${q.text}</strong><br><em>${q.answer}</em></span>
        </div>
      `).join('')}
    </div>` : '';

  const uriHtml = uri ? `<div class="uri-example">${uri}</div>` : '';

  const conHtml = consequence ? `
    <div class="consequence">
      <div class="con-label">Design Consequence</div>
      <div class="con-text">${consequence}</div>
    </div>` : '';

  document.getElementById('resultContent').style.display = 'block';
  document.getElementById('resultContent').innerHTML = `
    <div class="result-header">
      <div class="result-badge" style="background:${kind ? kind.color : '#BDBDAC'}">${kind ? kind.label.replace('\n', ' ') : 'Unclear'}</div>
      <div>
        <div class="result-kind">${name}</div>
        <div class="result-subject">${kind ? kind.short : 'Needs further analysis'}</div>
      </div>
    </div>
    <div class="result-body">
      <div class="rule-block">
        <div class="rule-label">Deciding Rule (REST API Design §4)</div>
        <div class="rule-text">${rule}</div>
      </div>
      ${qHtml}
      ${uriHtml}
      ${conHtml}
    </div>
  `;

  if (kindId) highlightLegend(kindId);
}

// ── INIT ────────────────────────────────────────────────────────────────────
renderLegend();
renderEntities();

document.getElementById('customInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') classifyCustom();
});
</script>
</body>
</html>
